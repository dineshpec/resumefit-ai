name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements*.txt
            mcp_server/requirements*.txt

      - name: Create application environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r app/requirements-dev.txt

      - name: Create tools-service environment
        if: hashFiles('mcp_server/requirements-dev.txt') != ''
        run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/python -m pip install -r mcp_server/requirements-dev.txt

      - name: Run the local gate
        run: python scripts/check.py
