name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements*.txt
            mcp_server/requirements*.txt

      - name: Create application environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r app/requirements-dev.txt

      - name: Create tools-service environment
        if: hashFiles('mcp_server/requirements-dev.txt') != ''
        run: |
          python -m venv .venv-mcp
          .venv-mcp/bin/python -m pip install -r mcp_server/requirements-dev.txt

      - name: Run the local gate
        run: python scripts/check.py

      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r app/requirements.txt
          pip-audit -r mcp_server/requirements.txt

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Validate the Caddyfile
        run: |
          docker run --rm -e DOMAIN=resume.example.test -e ACME_EMAIL=ci@example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build both images
        run: docker compose build app mcp

      - name: Check images run as non-root without secrets or tests
        run: |
          for image in resumefit-app resumefit-mcp; do
            uid=$(docker run --rm --entrypoint sh "$image" -c 'test ! -e .env && test ! -d tests && id -u')
            echo "$image runs as uid $uid"
            test "$uid" -ne 0
          done

      - name: Start app and tools service read-only and wait until healthy
        run: docker compose up -d --wait --wait-timeout 180 app mcp

      - name: Check the tools service answers the app and has no internet egress
        run: |
          docker compose exec -T app python -c "import urllib.request; print(urllib.request.urlopen('http://mcp:8000/health', timeout=5).read().decode())"
          if docker compose exec -T mcp python -c "import urllib.request; urllib.request.urlopen('https://example.com', timeout=5)"; then
            echo "tools service reached the internet"; exit 1
          fi

      - name: Extract a PDF through /mcp in the read-only, memory-limited tools service
        run: |
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.Memory}}' "$(docker compose ps -q mcp)")" = "true 536870912"
          docker compose exec -T app python - <<'EOF'
          import asyncio
          import os

          from resumefit.adapters.tools_gateway import ToolsGateway

          # Non-Latin-1 characters survive only if the image has its Unicode font.
          PHRASE = "PostgreSQL for José Müller — Отчёт"


          async def main() -> None:
              async with ToolsGateway(os.environ["MCP_URL"]) as tools:
                  pdf = await tools.render_pdf(f"# CI resume\n\nPython, FastAPI and {PHRASE}.", "CI resume")
                  assert pdf, "render_pdf failed"
                  # The tool name is extract_resume_text; it runs in a spawn worker limited to 256 MB.
                  result = await tools.extract_resume_text("resume.pdf", pdf)
              print(f"extraction ok={result.ok} error_code={result.error_code} pages={result.pages}")
              assert result.ok and PHRASE in result.text, result.error_code


          asyncio.run(main())
          EOF

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
