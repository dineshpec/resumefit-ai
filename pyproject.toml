# Tool settings only; the application and tools service are not installed as
# packages. Each has its own requirements files and virtual environment.

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "mcp_server"]
extend-exclude = [".venv-mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["app", "mcp_server"]
markers = [
    "live: calls the real OpenAI API; needs OPENAI_API_KEY (optional pre-release check)",
]
